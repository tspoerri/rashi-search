<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rashi on Nach Search</title>
<style>
:root {
  --bg: #f7f5f0; --panel: #ffffff; --ink: #2b2620; --muted: #8a8074;
  --accent: #7a5c2e; --accent-soft: #f0e8d8; --border: #e3ddd2;
  --hl: #fdeec7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1a17; --panel: #26231f; --ink: #e8e2d8; --muted: #9a917f;
    --accent: #d4b476; --accent-soft: #3a3223; --border: #3a362f;
    --hl: #4a3d1e;
  }
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Frank Ruhl Libre", Georgia, "Times New Roman", "SBL Hebrew", serif;
  font-size: 17px; line-height: 1.55;
}
.wrap { max-width: 52rem; margin: 0 auto; padding: 0 1.2rem 3rem; }
header { padding: 1.1rem 0 .4rem; display: flex; align-items: baseline; gap: .9rem; flex-wrap: wrap; }
header h1 { font-size: 1.45rem; color: var(--accent); font-weight: 700; }
header .count { color: var(--muted); font-size: .82rem; }
.tabs { margin-inline-start: auto; display: flex; gap: .4rem; }
.tabs button, #kbd-btn {
  font: inherit; font-size: .82rem; padding: .25rem .8rem; cursor: pointer;
  border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  border-radius: 999px;
}
.tabs button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
#controls { padding: .4rem 0 .9rem; }
.fields { display: flex; gap: .6rem; flex-wrap: wrap; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: .15rem; }
.field label { font-size: .72rem; color: var(--muted); }
input, select {
  font: inherit; padding: .45rem .6rem; border: 1px solid var(--border);
  border-radius: 8px; background: var(--panel); color: var(--ink);
}
input:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
#f-dh { width: 13.5rem; } #f-kw { width: 13.5rem; }
#f-sefer { width: 11rem; } #f-perek { width: 5.5rem; } #f-passuk { width: 5.5rem; }
#fieldbar { display: none; }
#f-smart { width: 100%; font-size: 1.1rem; padding: .6rem .8rem; }
.hint { font-size: .75rem; color: var(--muted); margin-top: .35rem; }

/* Hebrew keyboard dropdown */
#kbd-wrap { position: relative; display: inline-block; }
#kbd {
  display: none; position: absolute; top: calc(100% + 6px); inset-inline-end: 0; z-index: 20;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: .6rem; box-shadow: 0 6px 24px rgba(0,0,0,.15); width: 21rem; max-width: 90vw;
}
#kbd.open { display: block; }
#kbd .krow { display: flex; gap: .25rem; justify-content: center; margin-bottom: .25rem; direction: rtl; }
#kbd button {
  font: inherit; font-size: 1.05rem; min-width: 2rem; padding: .3rem 0; cursor: pointer;
  border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--ink);
}
#kbd button:hover { background: var(--accent-soft); }
#kbd button.wide { min-width: 5rem; font-size: .8rem; color: var(--muted); }

#results { display: flex; flex-direction: column; gap: .45rem; }
.hit {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: .55rem .8rem; cursor: pointer;
}
.hit:hover { border-color: var(--accent); }
.hit.open { border-color: var(--accent); cursor: default; }
.hit .sum { direction: rtl; text-align: right; }
.hit .dh { font-weight: 700; }
.hit .ref { font-size: .78rem; color: var(--muted); }
.hit .snip { font-size: .82rem; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.hit.open .snip { display: none; }
mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 1px; }
.exp { display: none; direction: rtl; text-align: right; margin-top: .6rem; border-top: 1px solid var(--border); padding-top: .7rem; }
.hit.open .exp { display: block; }
.exp .verse {
  font-size: 1.12rem; background: var(--accent-soft); border-radius: 8px;
  padding: .55rem .9rem; margin-bottom: .8rem;
}
.exp .rashi-dh { font-weight: 700; }
.exp .rashi-text { margin-top: .25rem; white-space: pre-wrap; }
.exp .note { margin-top: .6rem; font-size: .78rem; color: var(--muted); font-style: italic; }
.exp .links { margin-top: .8rem; direction: ltr; text-align: left; font-size: .82rem; }
.exp a { color: var(--accent); }
#empty { color: var(--muted); padding: 1rem 0; }
.ambig { color: var(--muted); padding: 1rem 0; }
.ambig button {
  font: inherit; font-size: .85rem; margin: .3rem .3rem 0 0; padding: .3rem .8rem;
  border: 1px solid var(--border); border-radius: 999px; background: var(--panel);
  color: var(--ink); cursor: pointer;
}
.ambig button:hover { border-color: var(--accent); background: var(--accent-soft); }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>חיפוש רש"י על נ"ך</h1>
  <span class="count" id="count">Loading…</span>
  <span class="count"><a href="./" style="color:var(--accent)">⌂</a> · <a href="chumash.html" style="color:var(--accent)">על התורה</a> · <a href="bavli.html" style="color:var(--accent)">על הש"ס</a></span>
  <nav class="tabs">
    <button id="tab-fields">Fields</button>
    <button id="tab-smart" class="active">Smart search</button>
    <span id="kbd-wrap">
      <button id="kbd-btn" title="Hebrew keyboard">⌨ עברית</button>
      <div id="kbd"></div>
    </span>
  </nav>
</header>

<div id="controls">
  <div class="fields" id="fieldbar">
    <div class="field"><label for="f-dh">ד"ה</label>
      <input id="f-dh" dir="auto" autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="ויאמר"></div>
    <div class="field"><label for="f-sefer">ספר</label>
      <input id="f-sefer" dir="auto" autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false" list="sfarim-list" placeholder="All"></div>
    <div class="field"><label for="f-perek">פרק</label>
      <input id="f-perek" dir="auto" autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="ו / 6"></div>
    <div class="field"><label for="f-passuk">פסוק</label>
      <input id="f-passuk" dir="auto" autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="א / 1"></div>
    <div class="field"><label for="f-kw">מילים</label>
      <input id="f-kw" dir="auto" autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="in the Rashi text"></div>
  </div>
  <datalist id="sfarim-list"></datalist>
  <div id="smartbar">
    <input id="f-smart" dir="auto" autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="ישעיהו ו הנני שלחני">
    <div class="hint">Combine sefer, perek and passuk (Hebrew letters or numbers) with words from the dibbur hamatchil or the Rashi text — in any order.</div>
  </div>
</div>

<div id="results"><div id="empty">Type to search.</div></div>
</div>

<script type="module">
"use strict";
import { ChipusIndex, foldToken, boundedEditDistance } from "./lib/chipus/src/index.js";
import { NACH_BOOKS, AMBIG, PAIRED_BOOKS, buildExactAliases, buildFoldedAliases } from "./lib/nach-aliases.js";

let DB = [];          // records
let NORM = [];        // normalized {dh, t, vt} + skeleton per record
let openHit = -1;
let mode = "smart";

let chipusIndex = null;
let DOC_INDEX = null;               // Map<doc, i> — maps chipus result docs back to DB index
let BOOK_EXACT = null;              // exact lowercase/literal phrase -> en | AMBIG
let BOOK_ALIAS1 = null;             // folded key -> book en (single-word names)
let BOOK_ALIAS2 = null;             // "key1|key2" -> book en (two-word names)

// Typo fallback for alias lookup: only called after an exact-key lookup misses.
function fuzzyAlias(map, keyCandidates) {
  let bestD = Infinity, bestVal = null, ambiguous = false;
  for (const cand of keyCandidates) {
    if (cand.length < 3) continue;
    const maxD = cand.length >= 6 ? 2 : 1;
    for (const [key, val] of map) {
      const d = boundedEditDistance(cand, key, maxD);
      if (d === Infinity) continue;
      if (d < bestD) { bestD = d; bestVal = val === AMBIG ? null : val; ambiguous = val === AMBIG; }
      else if (d === bestD && (val === AMBIG || val !== bestVal)) ambiguous = true;
    }
  }
  return ambiguous ? null : bestVal;
}

/* ---------- Hebrew utilities ---------- */
const NIKUD_RE = /[֑-ֽֿ-ׇ]/g;   // taamim+nikud, keep maqaf
function normalize(s) {
  return (s || "").replace(/־/g, " ")
          .replace(NIKUD_RE, "")
          .replace(/[״"׳'.,:;!?()\[\]{}]/g, "")
          .replace(/\s+/g, " ")
          .trim();
}
// ktiv-insensitive skeleton: drop ו/י so מוקדם matches מֻקְדָּם
function skel(s) {
  return s.replace(/[וי]/g, "").replace(/\s+/g, " ").trim();
}
// normalize but keep a map from normalized index -> display index
function normalizeWithMap(s) {
  let out = "", map = [];
  let lastSpace = true;
  for (let i = 0; i < s.length; i++) {
    let ch = s[i];
    if (ch === "־") ch = " ";
    if (NIKUD_RE.test(ch)) { NIKUD_RE.lastIndex = 0; continue; }
    NIKUD_RE.lastIndex = 0;
    if (/[״"׳'.,:;!?()\[\]{}]/.test(ch)) continue;
    if (/\s/.test(ch)) {
      if (lastSpace) continue;
      out += " "; map.push(i); lastSpace = true;
    } else {
      out += ch; map.push(i); lastSpace = false;
    }
  }
  return { norm: out, map };
}

const GEM = {"א":1,"ב":2,"ג":3,"ד":4,"ה":5,"ו":6,"ז":7,"ח":8,"ט":9,"י":10,
  "כ":20,"ך":20,"ל":30,"מ":40,"ם":40,"נ":50,"ן":50,"ס":60,"ע":70,"פ":80,"ף":80,
  "צ":90,"ץ":90,"ק":100,"ר":200,"ש":300,"ת":400};
function parseHebNum(tok) {
  tok = tok.replace(/[״"׳']/g, "");
  if (/^\d+$/.test(tok)) return parseInt(tok, 10);
  if (!tok || tok.length > 3) return null;
  let sum = 0, prev = Infinity;
  for (const ch of tok) {
    const v = GEM[ch];
    if (!v || v > prev) return null;   // must be non-increasing (e.g. קכג)
    sum += v; prev = v;
  }
  return sum >= 1 && sum <= 999 ? sum : null;
}
function toHebNum(n) {
  const H = [[400,"ת"],[300,"ש"],[200,"ר"],[100,"ק"],[90,"פ"],[80,"פ"],[70,"ע"],
    [60,"ס"],[50,"נ"],[40,"מ"],[30,"ל"],[20,"כ"],[10,"י"],[9,"ט"],[8,"ח"],[7,"ז"],
    [6,"ו"],[5,"ה"],[4,"ד"],[3,"ג"],[2,"ב"],[1,"א"]];
  let out = "";
  for (const [v, ch] of H) {
    while (n >= v) { out += ch; n -= v; }
  }
  return out.replace(/יה$/, "טו").replace(/יו$/, "טז");
}

/* ---------- load ---------- */
function setCount(text) { document.getElementById("count").textContent = text; }

async function loadAll() {
  setCount("Loading manifest…");
  const manifest = await (await fetch("data/nach/manifest.json")).json();
  const meta = manifest.books || [];

  BOOK_EXACT = buildExactAliases();
  const { alias1, alias2 } = buildFoldedAliases(foldToken);
  BOOK_ALIAS1 = alias1; BOOK_ALIAS2 = alias2;
  fillSfarimDatalist();

  const total = meta.length;
  let loaded = 0;
  setCount("Loading shards (0/" + total + ")…");
  const t0load = performance.now();
  const shardArrays = await Promise.all(meta.map(async (b) => {
    const arr = await (await fetch("data/nach/" + b.file)).json();
    loaded++;
    setCount("Loading shards (" + loaded + "/" + total + ")…");
    return arr;
  }));
  const loadMs = performance.now() - t0load;
  // Concatenate in canonical (manifest) order regardless of fetch completion order.
  DB = [];
  for (const arr of shardArrays) for (const r of arr) DB.push(r);

  setCount("Building index (" + DB.length.toLocaleString("en") + " records)…");
  await new Promise((r) => setTimeout(r, 0));  // let the status text paint before the heavy work

  const t0 = performance.now();
  NORM = DB.map((r) => {
    const dh = normalize(r.dh), t = normalize(r.t), vt = normalize(r.vt);
    return { dh, t, vt, dhS: skel(dh), tS: skel(t), vtS: skel(vt) };
  });

  // Winning chipus v3 ranking opts from the 2026-07-19 sweep (see chipus
  // DESIGN-v3.md "Sweep results"): coverageWeight=20, refineWeightLatin=40.
  // Overridable via globalThis.CHIPUS_OPTS so the eval/sweep harness can
  // test other configs without editing this file.
  const CHIPUS_OPTS = globalThis.CHIPUS_OPTS || { coverageWeight: 20, refineWeightLatin: 40 };
  chipusIndex = new ChipusIndex({
    fields: [
      { name: "dh", weight: 3 },
      { name: "t", weight: 1 },
      { name: "vt", weight: 1 },
    ],
    ...CHIPUS_OPTS,
  });
  chipusIndex.add(DB);
  DOC_INDEX = new Map();
  DB.forEach((d, i) => DOC_INDEX.set(d, i));
  const indexMs = performance.now() - t0;
  setCount(DB.length.toLocaleString("en") + " Rashis · loaded in " + Math.round(loadMs) +
    " ms · indexed in " + Math.round(indexMs) + " ms");
  runSearch();
}
loadAll();

function popBoost(r) {
  return Math.min(50, Math.log2(1 + (r.lk || 0)) * 3.5);
}

function fillSfarimDatalist() {
  const dl = document.getElementById("sfarim-list");
  dl.innerHTML = "";
  for (const b of NACH_BOOKS) dl.appendChild(new Option(b.he, b.he));
}
function resolveSeferInput(val) {
  val = (val || "").trim();
  if (!val) return "";
  const hit = NACH_BOOKS.find((b) => b.he === val || b.en.toLowerCase() === val.toLowerCase());
  return hit ? hit.en : "";
}

/* ---------- authorship disclaimer ---------- */
// Pseudo-Rashi commentary (cx: 1) covers Ezra, Nehemiah, I/II Chronicles —
// not composed by Rashi himself; traditionally attributed to a member of
// his school (often to R. Yosef Kara or an anonymous student), included
// here because it circulates as "Rashi" in printed editions.
const PSEUDO_RASHI_NOTE =
  'פירוש זה המיוחס ל"רש"י" בדפוסים אינו מרש"י עצמו, אלא מבית מדרשו.';
function noteFor(r) {
  return r.cx ? PSEUDO_RASHI_NOTE : null;
}

/* ---------- scoring ---------- */
function wordMatch(hay, tok) {
  // word-prefix match; returns index in hay or -1
  if (!tok) return -1;
  let i = hay.indexOf(tok);
  while (i !== -1) {
    if (i === 0 || hay[i - 1] === " ") return i;
    i = hay.indexOf(tok, i + 1);
  }
  return -1;
}

function search(q) {
  // q: {book, perek, passuk, dh, kw} — dh/kw normalized strings
  const dhToks = q.dh ? q.dh.split(" ") : [];
  const dhS = skel(q.dh || "");
  const hits = [];

  // Free-text (kw) scoring is delegated to chipus: it handles Hebrew,
  // transliteration, and typo tolerance in one pass across dh/t/vt.
  let chipusHits = null;
  if (q.kw && chipusIndex) {
    chipusHits = new Map();
    for (const res of chipusIndex.search(q.kw, { limit: DB.length })) {
      const idx = DOC_INDEX.get(res.doc);
      if (idx !== undefined) chipusHits.set(idx, res);
    }
  }

  for (let i = 0; i < DB.length; i++) {
    const r = DB[i], n = NORM[i];
    if (q.book && r.b !== q.book) continue;
    if (q.perek && r.c !== q.perek) continue;
    if (q.passuk && r.v !== q.passuk) continue;
    let score = 0;
    if (dhToks.length) {
      if (n.dh === q.dh) score += 1000;
      else if (n.dh.startsWith(q.dh)) score += 600;
      else if (n.dh.includes(q.dh)) score += 400;
      else if (n.dhS === dhS) score += 800;          // ktiv-insensitive
      else if (n.dhS.startsWith(dhS)) score += 450;
      else if (n.dhS.includes(dhS)) score += 300;
      else {
        let all = true, any = false;
        for (const t of dhToks) {
          if (wordMatch(n.dh, t) !== -1) { score += 120; any = true; }
          else if (wordMatch(n.dhS, skel(t)) !== -1) { score += 80; any = true; }
          else if (wordMatch(n.t, t) !== -1) { score += 15; all = false; }
          else if (n.t.includes(t)) { score += 8; all = false; }
          else { all = false; }
        }
        if (!any && score === 0) continue;
        if (all) score += 100;
      }
    }
    if (q.kw) {
      const hit = chipusHits && chipusHits.get(i);
      if (hit) {
        score += hit.score;
      } else if (q.perek && q.passuk) {
        // exact perek:passuk pin keeps that passuk's Rashis visible
        // even when the free-text terms match nothing
        score = Math.max(score, 1);
      } else {
        continue;
      }
    }
    if (!dhToks.length && !q.kw) score = 1;  // pure filter browse
    if (score > 0) hits.push({ i, score: score + popBoost(r) });
  }
  hits.sort((a, b) => b.score - a.score || a.i - b.i);
  return hits.slice(0, 60);
}

/* ---------- smart parse ---------- */
function smartTokenize(raw) {
  let s = raw.replace(/־/g, " ").replace(NIKUD_RE, "");
  s = s.replace(/[״"׳'!?()\[\]{};,]/g, "");
  s = s.replace(/\s+/g, " ").trim();
  return s.split(" ").filter(Boolean);
}

// Resolve a paired-book qualifier token ("aleph"/"1"/"א"/"a" or "bet"/"2"/"ב"/"b")
// following an AMBIG unqualified paired-book name. Returns "I"|"II"|null.
function pairedHalf(tok) {
  const t = (tok || "").toLowerCase();
  if (["aleph", "alef", "a", "1", "א", "א'", "ראשון"].includes(t)) return "I";
  if (["bet", "beis", "beit", "b", "2", "ב", "ב'", "שני"].includes(t)) return "II";
  return null;
}
// Which unqualified Hebrew/Latin token this AMBIG hit came from, so we can
// look it up in PAIRED_BOOKS (keyed by the English family name).
const AMBIG_FAMILY = {
  "שמואל": "Samuel", "shmuel": "Samuel", "samuel": "Samuel",
  "מלכים": "Kings", "melachim": "Kings", "melochim": "Kings", "kings": "Kings",
  "דברי הימים": "Chronicles", 'דה"י': "Chronicles",
  "divrei hayamim": "Chronicles", "chronicles": "Chronicles", "divrei hayomim": "Chronicles",
};

function smartParse(raw) {
  const q = { book: "", perek: 0, passuk: 0, dh: "", kw: "", ambigFamily: null };
  const toks = smartTokenize(raw);
  const rest = [];
  let i = 0;
  while (i < toks.length) {
    const tok = toks[i];
    const next = toks[i + 1];
    const isLatin = /[a-z]/i.test(tok);
    const two = next ? tok + " " + next : null;

    // two-word book name (exact phrase, Hebrew or Latin), tried first, at position 0 only
    if (!q.book && !q.ambigFamily && two && i === 0) {
      const exactHit = BOOK_EXACT.get(two.toLowerCase());
      if (exactHit === AMBIG) {
        q.ambigFamily = AMBIG_FAMILY[two.toLowerCase()] || null;
        // check for a following disambiguating qualifier
        const half = toks[i + 2] ? pairedHalf(toks[i + 2]) : null;
        if (half && q.ambigFamily) {
          q.book = PAIRED_BOOKS[q.ambigFamily][half];
          q.ambigFamily = null;
          i += 3; continue;
        }
        i += 2; continue;
      }
      if (exactHit) { q.book = exactHit; i += 2; continue; }
    }
    // three-word book phrase ("shmuel aleph 1"-style handled by exact map
    // already covering "shmuel aleph"; try 3-word exact too, e.g. "I Samuel"
    // handled by the 2-word branch above via "i samuel"). Also try longer
    // qualified phrases like "divrei hayamim aleph" (already 3 words: try
    // extending two->three at i===0).
    if (!q.book && !q.ambigFamily && i === 0 && toks.length >= 3) {
      const three = tok + " " + toks[1] + " " + toks[2];
      const exactHit3 = BOOK_EXACT.get(three.toLowerCase());
      if (exactHit3 && exactHit3 !== AMBIG) { q.book = exactHit3; i += 3; continue; }
    }
    // single-word exact book name (Hebrew or Latin), position 0 only
    if (!q.book && !q.ambigFamily && i === 0) {
      const exactHit = BOOK_EXACT.get(tok.toLowerCase());
      if (exactHit === AMBIG) {
        q.ambigFamily = AMBIG_FAMILY[tok.toLowerCase()] || null;
        const half = next ? pairedHalf(next) : null;
        if (half && q.ambigFamily) {
          q.book = PAIRED_BOOKS[q.ambigFamily][half];
          q.ambigFamily = null;
          i += 2; continue;
        }
        i++; continue;
      }
      if (exactHit) { q.book = exactHit; i++; continue; }
    }
    // folded two-word alias (typo-tolerant path), position 0 only
    if (!q.book && !q.ambigFamily && isLatin && next && i === 0) {
      let found = null;
      outer: for (const k1 of foldToken(tok)) {
        for (const k2 of foldToken(next)) {
          const hit = BOOK_ALIAS2.get(k1 + "|" + k2);
          if (hit && hit !== AMBIG) { found = hit; break outer; }
        }
      }
      if (!found) {
        const cands = [];
        for (const k1 of foldToken(tok)) for (const k2 of foldToken(next)) cands.push(k1 + "|" + k2);
        found = fuzzyAlias(BOOK_ALIAS2, cands);
      }
      if (found) { q.book = found; i += 2; continue; }
    }
    // folded single-word alias (typo-tolerant path), position 0 only
    if (!q.book && !q.ambigFamily && isLatin && i === 0) {
      let found = null;
      for (const k of foldToken(tok)) {
        if (k.length < 3) continue;
        const hit = BOOK_ALIAS1.get(k);
        if (hit && hit !== AMBIG) { found = hit; break; }
      }
      if (!found) found = fuzzyAlias(BOOK_ALIAS1, foldToken(tok));
      if (found) { q.book = found; i++; continue; }
    }
    // perek number (Arabic or gematria) — only meaningful once a book is known
    if (q.perek === 0 && q.book) {
      const n = parseHebNum(tok);
      if (n !== null) { q.perek = n; i++; continue; }
    }
    // passuk number — only meaningful once a perek is known
    if (q.passuk === 0 && q.perek) {
      const n = parseHebNum(tok);
      if (n !== null) { q.passuk = n; i++; continue; }
    }
    rest.push(tok); i++;
  }
  // free text goes to kw: it ranks across dibbur, body, and verse text
  q.kw = rest.join(" ");
  return q;
}

/* ---------- rendering ---------- */
function highlight(display, toks) {
  if (!toks.length) return esc(display);
  const { norm, map } = normalizeWithMap(display);
  const spans = [];
  for (const t of toks) {
    if (!t) continue;
    let idx = norm.indexOf(t);
    while (idx !== -1) {
      const from = map[idx];
      const to = idx + t.length - 1 < map.length ? map[idx + t.length - 1] + 1 : display.length;
      spans.push([from, to]);
      idx = norm.indexOf(t, idx + 1);
    }
  }
  if (!spans.length) return esc(display);
  spans.sort((a, b) => a[0] - b[0]);
  let out = "", pos = 0;
  for (const [f, t] of spans) {
    if (f < pos) continue;
    out += esc(display.slice(pos, f)) + "<mark>" + esc(display.slice(f, t)) + "</mark>";
    pos = t;
  }
  return out + esc(display.slice(pos));
}
function esc(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function refHe(r) {
  return r.bh + " " + toHebNum(r.c) + ":" + toHebNum(r.v);
}
function sefariaUrl(r) {
  const title = "Rashi on " + r.b;
  return "https://www.sefaria.org/" + encodeURIComponent(title.replace(/ /g, "_")) + "." +
    r.c + "." + r.v + "." + r.i;
}

function renderResults(hits, toks) {
  const box = document.getElementById("results");
  openHit = -1;
  if (!hits.length) {
    box.innerHTML = '<div id="empty">No results.</div>';
    return;
  }
  box.innerHTML = hits.map((h) => {
    const r = DB[h.i];
    const dhDisplay = r.dh ? highlight(r.dh, toks) : '<span style="color:var(--muted)">(אין ד"ה)</span>';
    return '<div class="hit" data-i="' + h.i + '">' +
      '<div class="sum"><span class="dh">' + dhDisplay + '</span> ' +
      '<span class="ref">· ' + refHe(r) + "</span>" +
      '<div class="snip">' + highlight(r.t.slice(0, 220), toks) + "</div></div>" +
      '<div class="exp"></div></div>';
  }).join("");
}

function renderAmbig(family) {
  const box = document.getElementById("results");
  const pair = PAIRED_BOOKS[family];
  if (!pair) { box.innerHTML = '<div id="empty">Ambiguous book name — please specify.</div>'; return; }
  const heMap = { Samuel: ["שמואל א", "שמואל ב"], Kings: ["מלכים א", "מלכים ב"], Chronicles: ["דברי הימים א", "דברי הימים ב"] };
  const [heI, heII] = heMap[family] || [pair.I, pair.II];
  box.innerHTML = '<div class="ambig">איזה ' + esc(family) + '? / Which book did you mean?<br>' +
    '<button data-book="' + esc(pair.I) + '">' + esc(heI) + " (" + esc(pair.I) + ")</button>" +
    '<button data-book="' + esc(pair.II) + '">' + esc(heII) + " (" + esc(pair.II) + ")</button></div>";
  box.querySelectorAll("button[data-book]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const book = btn.dataset.book;
      const smart = document.getElementById("f-smart");
      // Prepend the resolved English name so the rest of the typed query
      // (perek/passuk/kw) still parses normally on the next pass.
      const toks = smartTokenize(smart.value);
      // drop the leading ambiguous token(s) already consumed by smartParse
      // (best-effort: just re-run with the resolved book forced)
      smart.value = book + " " + toks.slice(1).join(" ");
      runSearch();
      smart.focus();
    });
  });
}

function toggleHit(el, toks) {
  const i = +el.dataset.i;
  if (el.classList.contains("open")) { el.classList.remove("open"); openHit = -1; return; }
  document.querySelectorAll(".hit.open").forEach((o) => o.classList.remove("open"));
  const r = DB[i];
  const note = noteFor(r);
  const dhDisplay = r.dh ? highlight(r.dh, toks) + "." : "";
  el.querySelector(".exp").innerHTML =
    '<div class="verse">' + esc(r.vt) + "</div>" +
    (dhDisplay ? '<div><span class="rashi-dh">' + dhDisplay + "</span></div>" : "") +
    '<div class="rashi-text">' + highlight(r.t, toks) + "</div>" +
    (note ? '<div class="note">' + esc(note) + "</div>" : "") +
    '<div class="links"><a href="' + sefariaUrl(r) + '" target="_blank" rel="noopener">Open in Sefaria ↗</a></div>';
  el.classList.add("open");
  openHit = i;
}

/* ---------- Hebrew keyboard ---------- */
const KBD_ROWS = [
  ["ק","ר","א","ט","ו","ן","ם","פ"],
  ["ש","ד","ג","כ","ע","י","ח","ל","ך","ף"],
  ["ז","ס","ב","ה","נ","מ","צ","ת","ץ"],
];
let lastInput = null;
function buildKbd() {
  const kbd = document.getElementById("kbd");
  kbd.innerHTML = KBD_ROWS.map(row =>
    '<div class="krow">' + row.map(ch => '<button data-ch="' + ch + '">' + ch + "</button>").join("") + "</div>"
  ).join("") +
  '<div class="krow"><button data-ch=" " class="wide">space</button>' +
  '<button data-act="bs" class="wide">⌫</button>' +
  '<button data-act="clear" class="wide">clear</button></div>';
  kbd.addEventListener("mousedown", e => e.preventDefault());  // keep input focus
  kbd.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const el = lastInput || defaultInput();
    if (b.dataset.act === "clear") el.value = "";
    else if (b.dataset.act === "bs") {
      const p = el.selectionStart;
      if (p > 0) {
        el.value = el.value.slice(0, p - 1) + el.value.slice(el.selectionEnd);
        el.setSelectionRange(p - 1, p - 1);
      }
    } else {
      const p = el.selectionStart;
      el.value = el.value.slice(0, p) + b.dataset.ch + el.value.slice(el.selectionEnd);
      el.setSelectionRange(p + 1, p + 1);
    }
    el.focus();
    el.dispatchEvent(new Event("input", { bubbles: true }));
  });
}
function defaultInput() {
  return document.getElementById(mode === "smart" ? "f-smart" : "f-dh");
}

/* ---------- wiring ---------- */
let currentToks = [];
function runSearch() {
  let q;
  if (mode === "smart") {
    q = smartParse(document.getElementById("f-smart").value);
  } else {
    q = {
      book: resolveSeferInput(document.getElementById("f-sefer").value),
      perek: parseHebNum(document.getElementById("f-perek").value.trim()) || 0,
      passuk: parseHebNum(document.getElementById("f-passuk").value.trim()) || 0,
      dh: normalize(document.getElementById("f-dh").value),
      kw: normalize(document.getElementById("f-kw").value),
      ambigFamily: null,
    };
  }
  if (q.ambigFamily) {
    renderAmbig(q.ambigFamily);
    document.getElementById("count").textContent = "Ambiguous book name";
    return;
  }
  const hasAny = q.book || q.perek || q.passuk || q.dh || q.kw;
  if (!hasAny) {
    document.getElementById("results").innerHTML = '<div id="empty">Type to search.</div>';
    return;
  }
  currentToks = (q.dh + " " + q.kw).split(" ").filter(Boolean);
  const t0 = performance.now();
  const hits = search(q);
  renderResults(hits, currentToks);
  document.getElementById("count").textContent =
    hits.length + " results · " + (performance.now() - t0).toFixed(1) + " ms";
}

let deb;
function onInput() { clearTimeout(deb); deb = setTimeout(runSearch, 80); }

for (const id of ["f-dh", "f-sefer", "f-perek", "f-passuk", "f-kw", "f-smart"]) {
  const el = document.getElementById(id);
  el.addEventListener("input", onInput);
  el.addEventListener("focus", () => { lastInput = el; });
}
document.getElementById("results").addEventListener("click", e => {
  if (e.target.closest("a")) return;           // let the Sefaria link work
  if (e.target.closest("button")) return;      // let the ambiguous-book buttons work
  const hit = e.target.closest(".hit");
  if (hit) toggleHit(hit, currentToks);
});
document.getElementById("tab-fields").addEventListener("click", () => setMode("fields"));
document.getElementById("tab-smart").addEventListener("click", () => setMode("smart"));
function setMode(m) {
  mode = m;
  document.getElementById("tab-fields").classList.toggle("active", m === "fields");
  document.getElementById("tab-smart").classList.toggle("active", m === "smart");
  document.getElementById("fieldbar").style.display = m === "fields" ? "flex" : "none";
  document.getElementById("smartbar").style.display = m === "smart" ? "block" : "none";
  defaultInput().focus();
  runSearch();
}
buildKbd();
document.getElementById("kbd-btn").addEventListener("click", () => {
  document.getElementById("kbd").classList.toggle("open");
  (lastInput || defaultInput()).focus();
});
document.addEventListener("click", e => {
  if (!e.target.closest("#kbd-wrap"))
    document.getElementById("kbd").classList.remove("open");
});
</script>
</body>
